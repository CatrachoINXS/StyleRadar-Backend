services:
  postgres:
    image: postgres:16-alpine
    container_name: styleradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - styleradar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-styleradar}:${IMAGE_TAG:-latest}
    container_name: styleradar-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Defina JWT_SECRET_BASE64 en .env}
      JWT_DURATION: ${JWT_DURATION:-PT60M}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STYLERADAR_DEMO_ENABLED: ${STYLERADAR_DEMO_ENABLED:-false}
      STYLERADAR_DEMO_PASSWORD: ${STYLERADAR_DEMO_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - styleradar-network

volumes:
  postgres-data:

networks:
  styleradar-network:
    driver: bridge
