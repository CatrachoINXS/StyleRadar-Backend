spring.application.name=style-radar

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

styleradar.security.jwt.secret-base64=${JWT_SECRET_BASE64:}
styleradar.security.jwt.duration=${JWT_DURATION:PT60M}

styleradar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Probador virtual (RF-23) y fotos del catálogo: el servicio valida el límite de 5 MB por archivo.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

styleradar.demo.enabled=${STYLERADAR_DEMO_ENABLED:false}
styleradar.demo.password=${STYLERADAR_DEMO_PASSWORD:}

styleradar.probador.ia.url=${PROBADOR_IA_URL:https://generativelanguage.googleapis.com/v1beta}
styleradar.probador.ia.api-key=${PROBADOR_IA_API_KEY:}
styleradar.probador.ia.modelo=${PROBADOR_IA_MODELO:gemini-3.1-flash-lite-image}
